```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة ليك</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #100d1c, #39213f, #17172e);
    color: white;
}

.card {
    width: 100%;
    max-width: 650px;
    min-height: 470px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #f4b8d3;
}

#dots {
    display: flex;
    gap: 7px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #66536c;
}

.dot.active {
    background: #ffb6d5;
    box-shadow: 0 0 10px #ffb6d5;
}

h1 {
    color: #ffd9e9;
    margin-top: 35px;
    font-size: 27px;
}

#message {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 19px;
    line-height: 2;
    min-height: 220px;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 22px;
    background: #ffb6d5;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.buttons {
    margin-top: auto;
    padding-top: 25px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

button {
    padding: 13px 25px;
    border: none;
    border-radius: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
}

#next {
    background: #ffb6d5;
    color: #29162c;
}

#next:disabled {
    opacity: 0.5;
    cursor: default;
}

#restart {
    background: rgba(255,255,255,0.12);
    color: white;
    display: none;
}

#hint {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #c9b9d0;
}

</style>
</head>

<body>

<div class="card">

    <div class="top">
        <span id="pageLabel">الصفحة 1 من 4</span>
        <div id="dots"></div>
    </div>

    <h1 id="heading">بص يا يوسف</h1>

    <div id="message"></div>

    <div class="buttons">
        <button id="restart">ابدأ من الأول</button>
        <button id="next" disabled>Next ←</button>
    </div>

    <div id="hint">استنى لحد ما الكلام يكتمل</div>

</div>

<script>

const pages = [

{
heading: "بص يا يوسف",
text: `بص ي يوسف انا نفسيتي اتدمرت وتعبت عمتا انا كل كلامي دا مش يفرق معاك ب ربع جنيه وانا عارفه دا كويس دا انا بقيت عامله زي الراديو وانا بقول نفس الكلمتين كل شويه بس اعمل ايه مش ب ايدي`
},

{
heading: "خليني أقولك",
text: `اوسخ م في الموضوع ان كل م افكر الاقي انا اللي عملت كدا ف نفسي انا اللي دخلت علاقه من الاول انا اللي علقت نفسي بولد كدا رغم اني اتحذرت وانا كنت واعيه صدقني لحد م وقعت معاك وحبيتك واتعلقت بيك وبقا اهم حاجه عند يووسف طظ ف اي حد الا يوسف بابا اللي هو كل حياتي بقيت بكدب عليه وبيه متخيل علشان مين علشانك`
},

{
heading: "نفس الكلام تاني",
text: `نفس الكلمتين دول برضو مش يفرقوا قولتهم كتير قبل كدا بس برضو بقعد اعيد جايه اشكيلك من نفسك 😂 بس هتكون اخر مره اشكيلك اصلا بس حبيت اقولك اللي جوايا برضو مهما كان دا انت يوووسف جوجو حبيبي`
},

{
heading: "آخر كلام",
text: `انا اخر حاجه اقدر اقولهالك ان انا بجد بحبك وكنت مقدره كل حاجه ومهما اتغيرت عليك بفضل احبك لكن انا معرفش ايه غيرك عليا بس تغيرك كان اوحش بكتييير ومش اعطلك تاني عن دراستك واسفه واتمنى تاخد المسج دي وتبطل تبعت ياريت بجد لو صعب عليك ف هيكون اصعب عليا وانت عارف كدا بس بعد كدا كل واحد هيرتاح وانا اكتر`
}

];

const message = document.getElementById("message");
const heading = document.getElementById("heading");
const pageLabel = document.getElementById("pageLabel");
const next = document.getElementById("next");
const restart = document.getElementById("restart");
const hint = document.getElementById("hint");
const dots = document.getElementById("dots");

let currentPage = 0;
let typingTimer;
let isTyping = false;

pages.forEach((page, index) => {
    const dot = document.createElement("span");
    dot.className = "dot" + (index === 0 ? " active" : "");
    dots.appendChild(dot);
});

function showPage(index) {

    clearInterval(typingTimer);

    currentPage = index;

    const page = pages[currentPage];
    const allDots = dots.querySelectorAll(".dot");

    heading.textContent = page.heading;

    pageLabel.textContent =
        `الصفحة ${currentPage + 1} من ${pages.length}`;

    allDots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentPage);
    });

    message.textContent = "";

    const cursor = document.createElement("span");
    cursor.className = "cursor";
    message.appendChild(cursor);

    next.disabled = true;

    next.textContent =
        currentPage === pages.length - 1
        ? "النهاية"
        : "Next ←";

    restart.style.display = "none";

    hint.textContent = "استنى لحد ما الكلام يكتمل";

    isTyping = true;

    let charIndex = 0;

    typingTimer = setInterval(() => {

        if (charIndex < page.text.length) {

            message.insertBefore(
                document.createTextNode(page.text.charAt(charIndex)),
                cursor
            );

            charIndex++;

        } else {

            clearInterval(typingTimer);

            cursor.remove();

            isTyping = false;

            next.disabled = false;

            hint.textContent =
                currentPage === pages.length - 1
                ? "وصلت لآخر صفحة"
                : "اضغط Next عشان تكمل";

        }

    }, 40);

}

next.addEventListener("click", () => {

    if (isTyping) return;

    if (currentPage < pages.length - 1) {

        showPage(currentPage + 1);

    } else {

        next.style.display = "none";
        restart.style.display = "inline-block";
        hint.textContent = "انتهت الرسالة";

    }

});

restart.addEventListener("click", () => {

    next.style.display = "inline-block";
    showPage(0);

});

showPage(0);

</script>

</body>
</html>
```
